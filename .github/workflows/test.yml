name: Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: ffmpeg -loglevel error -y -loop 1 -i tests/plate.png -t 1 -r 5 -pix_fmt yuv420p tests/plate.y4m
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && node tests/e2e.js
      - name: Push screenshots to branch "shots"
        if: always()
        run: |
          cd shots
          git init -q -b shots && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "shots ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
